<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>proof-of-match</title>
<style>
:root{
  /* Anchored on Base blue, since Base Sepolia is where this deploys. */
  --bg:#05070e; --bg2:#080c17;
  --surface:rgba(19,26,43,.72); --surface2:#111828;
  --line:#1c2740; --line2:#26334f;
  --text:#e8edf9; --dim:#8b98b8; --faint:#5a6786;
  --brand:#0052ff; --brand2:#4d8bff; --cyan:#22d3ee; --violet:#a855f7;
  --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b;
  --r:12px;
  --e:cubic-bezier(.22,1,.36,1);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font:14px/1.6 var(--sans);
  background:
    radial-gradient(900px 500px at 12% -8%, rgba(0,82,255,.16), transparent 60%),
    radial-gradient(760px 460px at 92% 4%, rgba(168,85,247,.12), transparent 60%),
    var(--bg);
  background-attachment:fixed;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono)}

/* -------------------------------------------------------------------- motion */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes flow{to{background-position:200% 0}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(3px)}50%{transform:translateX(-3px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(0,82,255,0)}50%{box-shadow:0 0 22px 0 rgba(0,82,255,.35)}}
.rise{animation:rise .55s var(--e) both}
.pop{animation:pop .4s var(--e) both}
.shake{animation:shake .5s both}

/* -------------------------------------------------------------------- chrome */
header{display:flex;align-items:center;gap:14px;padding:15px 24px;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;
  background:rgba(5,7,14,.82);backdrop-filter:blur(14px)}
h1{font:600 16px/1 var(--mono);margin:0;letter-spacing:-.01em;
  background:linear-gradient(100deg,var(--brand2),var(--cyan) 45%,var(--violet));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font:500 11px/1.7 var(--sans);color:var(--dim);border:1px solid var(--line);
  padding:2px 10px;border-radius:20px;background:var(--surface2)}
.tag b{color:var(--text);font-weight:600}
.spacer{margin-left:auto}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);
  margin-right:7px;box-shadow:0 0 8px var(--ok);animation:pulse 2.4s infinite}
.dot.off{background:var(--bad);box-shadow:0 0 8px var(--bad)}

button{background:var(--surface2);color:var(--text);border:1px solid var(--line2);
  border-radius:9px;padding:8px 15px;cursor:pointer;font:500 12.5px var(--sans);
  transition:border-color .2s,background .2s,transform .12s var(--e),box-shadow .25s}
button:hover{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(0,82,255,.13)}
button:active{transform:translateY(1px)}
button.primary{background:linear-gradient(135deg,var(--brand),#3b6fff);
  border-color:transparent;color:#fff;font-weight:600}
button.primary:hover{box-shadow:0 6px 22px rgba(0,82,255,.4)}
button[disabled]{opacity:.45;cursor:not-allowed}
button.chip{padding:5px 12px;font-size:11.5px;border-radius:20px}
button.chip.on{background:rgba(0,82,255,.16);border-color:var(--brand2);color:#cfe0ff}

main{display:grid;grid-template-columns:272px 1fr;min-height:calc(100vh - 57px)}
aside{border-right:1px solid var(--line);padding:16px;overflow:auto}
section{padding:22px 26px 70px;overflow:auto;max-width:1180px}

.run{padding:11px 13px;border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:9px;cursor:pointer;background:var(--surface2);
  transition:border-color .2s,transform .2s var(--e),box-shadow .25s}
.run:hover{border-color:var(--line2);transform:translateX(3px)}
.run.on{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(0,82,255,.14)}
.run b{display:block;font:600 12.5px var(--mono)}
.run span{display:block;color:var(--faint);font-size:11px}

/* --------------------------------------------------------------------- cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:18px 20px;margin-bottom:15px;backdrop-filter:blur(10px)}
.card h2{margin:0 0 14px;font:600 10.5px var(--sans);letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:10px}
.kv{display:grid;grid-template-columns:158px 1fr;gap:7px 16px;font-size:13px}
.kv>div:nth-child(odd){color:var(--dim)}
.hash{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere;color:var(--cyan)}

/* --------------------------------------------------------------------- verdict */
.band{border-radius:14px;padding:18px 22px;margin-bottom:16px;border:1px solid var(--line);
  background:linear-gradient(120deg,rgba(0,82,255,.14),rgba(168,85,247,.08));
  display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.band.ok{border-color:rgba(34,197,94,.45);
  background:linear-gradient(120deg,rgba(34,197,94,.15),rgba(34,197,94,.03))}
.band.bad{border-color:rgba(239,68,68,.45);
  background:linear-gradient(120deg,rgba(239,68,68,.15),rgba(239,68,68,.03))}
.band.warn{border-color:rgba(245,158,11,.45);
  background:linear-gradient(120deg,rgba(245,158,11,.15),rgba(245,158,11,.03))}
.band .big{font:700 21px/1.1 var(--sans);letter-spacing:.02em}
.band .sub{color:var(--dim);font-size:12.5px;max-width:560px}

/* -------------------------------------------------------------------- pipeline */
.pipe{display:grid;grid-template-columns:1fr 40px 1fr 40px 1fr;align-items:center;
  margin-bottom:16px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;position:relative;overflow:hidden;backdrop-filter:blur(10px)}
.stage .n{font:600 10px var(--sans);color:var(--faint);letter-spacing:.16em}
.stage .t{font:600 14px var(--sans);margin-top:4px}
.stage .v{font-size:11.5px;color:var(--dim);margin-top:6px}
.stage::after{content:"";position:absolute;inset:auto 0 0 0;height:2px;
  transform-origin:left;transform:scaleX(0);animation:grow .7s var(--e) forwards;
  background:linear-gradient(90deg,var(--brand),var(--brand2))}
.stage.s2::after{background:linear-gradient(90deg,var(--violet),#c084fc)}
.stage.s3::after{background:linear-gradient(90deg,var(--ok),#4ade80)}
.stage.s3.bad::after{background:linear-gradient(90deg,var(--bad),#f87171)}
@keyframes grow{to{transform:scaleX(1)}}
.link{height:2px;background:linear-gradient(90deg,transparent,var(--line2),transparent);
  background-size:200% 100%;animation:flow 3s linear infinite}

/* ------------------------------------------------------------------- face card */
.facewrap{display:flex;gap:20px;align-items:flex-start}
.facepic{width:196px;border-radius:var(--r);border:1px solid var(--line2);display:block;
  animation:pop .55s var(--e) both}

/* ---------------------------------------------------------------- candidates */
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:7px 9px;color:var(--faint);font:600 10.5px var(--sans);
  letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--line)}
td{padding:9px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{animation:rise .4s var(--e) both;transition:background .18s}
tbody tr.rejected{opacity:.48}
tbody tr:hover{background:rgba(0,82,255,.07)}
td.url{max-width:400px;overflow-wrap:anywhere;font-size:12px}
a{color:var(--brand2);text-decoration:none}
a:hover{text-decoration:underline}
.bar{height:5px;background:#141c2e;border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;transition:width 1s var(--e);
  background:linear-gradient(90deg,var(--brand),var(--cyan))}
.bar i.no{background:var(--line2)}

.pill{display:inline-block;padding:2px 10px;border-radius:20px;font:500 10.5px var(--sans);
  border:1px solid var(--line2);letter-spacing:.03em;white-space:nowrap}
.pill.ok{border-color:rgba(34,197,94,.5);color:var(--ok);background:rgba(34,197,94,.1)}
.pill.bad{border-color:rgba(239,68,68,.5);color:var(--bad);background:rgba(239,68,68,.1)}
.pill.warn{border-color:rgba(245,158,11,.5);color:var(--warn);background:rgba(245,158,11,.1)}
.pill.v{border-color:rgba(168,85,247,.5);color:#c084fc;background:rgba(168,85,247,.1)}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)} .dim{color:var(--dim)}
.empty{color:var(--dim);padding:48px 0;text-align:center}

/* ------------------------------------------------------------- merkle tree */
.tree{display:flex;flex-direction:column-reverse;gap:12px;padding:6px 0 2px}
.level{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.node{width:26px;height:12px;border-radius:3px;background:#182135;
  border:1px solid var(--line2);cursor:default;
  transition:background .3s var(--e),box-shadow .3s,transform .2s var(--e)}
.level:first-child .node{width:34px}
.node.leaf{cursor:pointer}
.node.leaf:hover{transform:translateY(-2px);border-color:var(--brand2)}
.node.path{background:linear-gradient(135deg,var(--brand),var(--brand2));
  border-color:transparent;box-shadow:0 0 12px rgba(0,82,255,.6)}
.node.sib{background:rgba(168,85,247,.5);border-color:rgba(168,85,247,.7);
  box-shadow:0 0 10px rgba(168,85,247,.4)}
.treelegend{display:flex;gap:16px;font-size:11.5px;color:var(--dim);margin-top:14px;
  flex-wrap:wrap;align-items:center}
.swatch{display:inline-block;width:14px;height:9px;border-radius:2px;margin-right:6px;
  vertical-align:middle}

/* ------------------------------------------------------------ verification */
.steps{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.step{display:flex;align-items:center;gap:12px;font-size:13px;opacity:.32;
  transition:opacity .35s var(--e)}
.step.live,.step.done{opacity:1}
.step .ic{width:18px;height:18px;border-radius:50%;border:2px solid var(--faint);
  flex:none;display:grid;place-items:center;font-size:10px;transition:.3s}
.step.live .ic{border-color:var(--brand2);border-right-color:transparent;
  animation:spin .7s linear infinite}
.step.pass .ic{border-color:var(--ok);background:rgba(34,197,94,.16);color:var(--ok)}
.step.fail .ic{border-color:var(--bad);background:rgba(239,68,68,.16);color:var(--bad)}
.step .detail{color:var(--dim);font-size:11.5px;margin-left:auto;font-family:var(--mono)}

/* -------------------------------------------------------------- simulator */
.sim{border:1px dashed var(--line2);border-radius:var(--r);padding:15px;margin-top:13px;
  background:rgba(8,12,23,.6)}
.sim input{width:100%;background:#080c17;border:1px solid var(--line2);color:var(--text);
  border-radius:8px;padding:8px 11px;font:12px var(--mono);transition:border-color .2s}
.sim input:focus{outline:none;border-color:var(--brand2);
  box-shadow:0 0 0 3px rgba(0,82,255,.14)}
.sim label{display:block;font:600 10.5px var(--sans);color:var(--faint);
  letter-spacing:.1em;text-transform:uppercase;margin:10px 0 5px}
.simout{margin-top:13px;font-size:12px;min-height:20px}

.copy{border:none;background:none;color:var(--faint);cursor:pointer;padding:0 0 0 7px;
  font-size:11px;font-family:var(--sans)}
.copy:hover{color:var(--brand2);box-shadow:none}

@media (max-width:920px){
  main{grid-template-columns:1fr}
  aside{border-right:none;border-bottom:1px solid var(--line);max-height:168px}
  .pipe{grid-template-columns:1fr;gap:9px}
  .link{display:none}
  .facewrap{flex-direction:column}
  .facepic{width:100%;max-width:290px}
  .kv{grid-template-columns:1fr;gap:2px}
  .kv>div:nth-child(even){margin-bottom:9px}
  td.url{max-width:none}
  section{padding:15px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}
</style></head><body>

<header>
  <h1>proof-of-match</h1>
  <span class="tag">evidence viewer</span>
  <span class="tag" id="chain"><span class="dot off"></span>connecting</span>
  <span class="spacer"></span>
  <button onclick="loadRuns(true)">Refresh</button>
</header>

<main>
  <aside id="runs"><div class="empty">loading&hellip;</div></aside>
  <section id="detail"><div class="empty">Select a run.</div></section>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const short = (h, n = 10) => h ? h.slice(0, n + 2) + '…' + h.slice(-4) : '--';

let current = null, bundle = null, listSignature = null, filter = 'all';

async function get(u){ const r = await fetch(u); if(!r.ok) throw new Error(await r.text()); return r.json(); }
async function post(u, b){
  const r = await fetch(u, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(b)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

function copy(text, el){
  navigator.clipboard?.writeText(text).then(() => {
    const was = el.textContent; el.textContent = 'copied';
    setTimeout(() => el.textContent = was, 1100);
  }).catch(() => {});
}

/* ----------------------------------------------------------------- run list */
async function loadRuns(force){
  try{
    const {runs, chain} = await get('/api/runs');
    $('#chain').innerHTML = chain.connected
      ? `<span class="dot"></span>chain <b>${chain.chain_id}</b> &middot; block <b>${chain.block}</b>`
      : '<span class="dot off"></span>chain offline';

    if(!runs.length){
      $('#runs').innerHTML = '<div class="empty">No bundles yet.<br><br>'
        + '<span class="dim">Run the pipeline first.</span></div>';
      listSignature = null; return;
    }
    const sig = runs.map(r => r.id).join(',');
    if(sig === listSignature && !force) return;
    const keep = current; listSignature = sig;

    $('#runs').innerHTML = runs.map((r, i) => `
      <div class="run rise" data-id="${esc(r.id)}" style="animation-delay:${i*35}ms">
        <b>${esc(r.id.slice(0,12))}</b>
        <span>${esc(r.created_at)}</span>
        <span>${r.matched ? `${r.candidates} candidates`
          : '<span class="warn">no match</span>'}</span>
      </div>`).join('');
    document.querySelectorAll('.run').forEach(el => el.onclick = () => show(el.dataset.id));

    const kept = keep && runs.some(r => r.id === keep);
    if(kept){
      document.querySelectorAll('.run').forEach(el =>
        el.classList.toggle('on', el.dataset.id === keep));
      current = keep;
    } else { show(runs[0].id); }
  }catch(e){ $('#runs').innerHTML = `<div class="empty bad">${esc(e.message)}</div>`; }
}

/* ------------------------------------------------------------------- detail */
async function show(id){
  current = id; filter = 'all';
  document.querySelectorAll('.run').forEach(el =>
    el.classList.toggle('on', el.dataset.id === id));
  $('#detail').innerHTML = '<div class="empty">loading&hellip;</div>';
  try{
    bundle = await get('/api/run/' + encodeURIComponent(id));
    render(bundle);
    chainState(id);
    drawTree(null);
  }catch(e){ $('#detail').innerHTML = `<div class="empty bad">${esc(e.message)}</div>`; }
}

function candidateRows(){
  const rows = bundle.candidates
    .map((c, i) => ({c, i}))
    .filter(({c}) => filter === 'all' ? true
      : filter === 'accepted' ? c.accepted
      : filter === 'social' ? c.social
      : !c.accepted);
  if(!rows.length) return '<tr><td colspan="5" class="dim">nothing matches this filter</td></tr>';
  return rows.map(({c, i}, n) => `
    <tr class="${c.accepted?'':'rejected'}" style="animation-delay:${n*26}ms">
      <td class="dim mono">${i}</td>
      <td style="min-width:104px">
        ${c.similarity==null ? '<span class="dim">--</span>' : `
          <b class="mono ${c.accepted?'ok':'bad'}">${c.similarity.toFixed(4)}</b>
          <div class="bar"><i data-w="${Math.max(0,Math.min(1,c.similarity))*100}"
            class="${c.accepted?'':'no'}"></i></div>`}
      </td>
      <td>${c.accepted?'<span class="pill ok">accepted</span>'
                      :`<span class="pill">${esc(c.status)}</span>`}</td>
      <td>${c.social?'<span class="pill v">social</span>':''}</td>
      <td class="url"><a href="${esc(c.page_url)}" target="_blank"
        rel="noopener noreferrer">${esc(c.page_url)}</a></td>
    </tr>`).join('');
}

function setFilter(f){
  filter = f;
  document.querySelectorAll('.filters button').forEach(b =>
    b.classList.toggle('on', b.dataset.f === f));
  $('#rows').innerHTML = candidateRows();
  animateBars();
}

const animateBars = () => requestAnimationFrame(() =>
  document.querySelectorAll('.bar i').forEach(el => el.style.width = el.dataset.w + '%'));

function render(b){
  const q = b.query, d = b.decision, m = b.merkle, a = b.attestation || {};
  const replay = b.search.provider === 'replay';
  const counts = {
    all: b.candidates.length,
    accepted: b.candidates.filter(c => c.accepted).length,
    social: b.candidates.filter(c => c.social).length,
    rejected: b.candidates.filter(c => !c.accepted).length,
  };

  $('#detail').innerHTML = `
    <div class="band rise" id="band">
      <div>
        <div class="big" id="bandTitle">${d.matched ? 'Match attested' : 'No match'}</div>
        <div class="sub" id="bandSub">${d.matched
          ? `${counts.accepted} of ${counts.all} candidates cleared ${b.threshold}, and the run's evidence root is committed on chain.`
          : 'No candidate cleared the threshold, so nothing was written. The record is for matches, not attempts.'}</div>
      </div>
      <span class="spacer"></span>
      <button class="primary" id="vbtn" onclick="runVerify()">Verify on chain</button>
    </div>

    <div class="pipe">
      <div class="stage rise"><div class="n">STAGE 01</div><div class="t">Face</div>
        <div class="v">confidence ${q.detect_score} &middot; ${q.detect_scale}px</div></div>
      <div class="link"></div>
      <div class="stage s2 rise" style="animation-delay:80ms">
        <div class="n">STAGE 02</div><div class="t">Search</div>
        <div class="v">${b.search.candidates_returned} found &middot; ${esc(b.search.provider)}
          ${replay?'<span class="pill warn">replay</span>':''}</div></div>
      <div class="link"></div>
      <div class="stage s3 rise" id="stage3" style="animation-delay:160ms">
        <div class="n">STAGE 03</div><div class="t">Chain</div>
        <div class="v" id="stage3v">${a.written?'attested':'not written'}</div></div>
    </div>

    <div class="card rise" style="animation-delay:200ms">
      <h2>Query face</h2>
      <div class="facewrap">
        ${b.face_render ? `<img class="facepic" alt="detected face"
          src="/api/face/${encodeURIComponent(b.run_id)}">` : ''}
        <div class="kv" style="flex:1">
          <div>source</div><div>${esc(q.source_name)}</div>
          <div>bounding box</div><div class="mono">${q.bbox.join(', ')}</div>
          <div>faces in frame</div><div>${q.faces_found}</div>
          <div>image sha256</div><div class="hash">${esc(q.image_sha256)}
            <button class="copy" onclick="copy('${esc(q.image_sha256)}',this)">copy</button></div>
          <div>embedding</div><div class="hash">${esc(q.embedding_sha256)}</div>
        </div>
      </div>
    </div>

    <div class="card rise" style="animation-delay:240ms">
      <h2>Consent <span id="consentPill"></span></h2>
      <div id="consentBody" class="dim">checking the chain&hellip;</div>
    </div>

    <div class="card rise" style="animation-delay:280ms">
      <h2>Candidates <span class="dim" style="text-transform:none;letter-spacing:0">
        threshold ${b.threshold}</span></h2>
      <div class="filters">
        ${['all','accepted','social','rejected'].map(f =>
          `<button class="chip${f==='all'?' on':''}" data-f="${f}"
            onclick="setFilter('${f}')">${f} <span class="dim">${counts[f]}</span></button>`).join('')}
      </div>
      <table><thead><tr><th></th><th>similarity</th><th>result</th><th></th>
        <th>source page</th></tr></thead><tbody id="rows">${candidateRows()}</tbody></table>
      <p class="dim" style="font-size:11.5px;margin:13px 0 0">
        Dimmed rows were returned by the search and rejected here, after re-downloading the
        image and re-embedding it. A search hit is not a face match.</p>
    </div>

    <div class="card rise" style="animation-delay:320ms">
      <h2>Merkle commitment</h2>
      <div class="kv" style="margin-bottom:14px">
        <div>root</div><div class="hash">${esc(m.root)}
          <button class="copy" onclick="copy('${esc(m.root)}',this)">copy</button></div>
        <div>leaves</div><div>${m.leaf_count}</div>
        <div>network</div><div>${esc(a.network||'--')}</div>
        <div>contract</div><div class="hash">${esc(a.contract||'--')}</div>
        <div>transaction</div><div class="hash">${esc(a.tx_hash||'--')}</div>
      </div>
      <div class="tree" id="tree"></div>
      <div class="treelegend">
        <span><span class="swatch" style="background:#182135;border:1px solid var(--line2)"></span>leaf</span>
        <span><span class="swatch" style="background:linear-gradient(135deg,var(--brand),var(--brand2))"></span>proof path</span>
        <span><span class="swatch" style="background:rgba(168,85,247,.5)"></span>sibling supplied</span>
        <span id="treeNote" class="dim">Click any leaf to trace its path to the root.</span>
      </div>
    </div>

    <div class="card rise" style="animation-delay:360ms">
      <h2>Verification</h2>
      <div class="steps" id="steps"></div>
      <div id="verdict"></div>
    </div>

    <div class="card rise" style="animation-delay:400ms">
      <h2>Tamper simulator <span class="pill warn">demonstration</span></h2>
      <p class="dim" style="font-size:12.5px;margin:0 0 4px">
        <b class="warn">These are not pipeline inputs.</b> They forge the already-recorded
        evidence, the way an attacker editing the bundle on disk would &mdash; so any edit
        <em>should</em> break verification. That is the property being shown.</p>
      <p class="dim" style="font-size:12px;margin:0">
        The commitment fingerprints the exact recorded bytes, not the subject. Swapping in
        another photo of the same person still diverges: the root has no opinion about who
        is in the picture. To scan a different image, run the pipeline
        <code>py run.py --image &hellip; --image-url &hellip;</code>.
        Nothing here is written &mdash; the bundle on disk is untouched.</p>
      <div class="sim">
        <label>forge candidate[0] &mdash; source page</label>
        <input id="simUrl" value="${esc(b.candidates[0]?.page_url||'')}">
        <label>forge candidate[0] &mdash; similarity</label>
        <input id="simSim" value="${b.candidates[0]?.similarity ?? ''}">
        <div class="simout" id="simOut"><span class="dim">unchanged</span></div>
        <button class="chip" style="margin-top:12px" onclick="resetSim()">Reset</button>
      </div>
    </div>`;

  animateBars();
  $('#simUrl').oninput = simulate;
  $('#simSim').oninput = simulate;
}

/* -------------------------------------------------------------- merkle tree */
async function drawTree(leaf){
  try{
    const url = '/api/tree/' + encodeURIComponent(current)
      + (leaf === null || leaf === undefined ? '' : '?leaf=' + leaf);
    const t = await get(url);
    const el = $('#tree'); if(!el) return;

    el.innerHTML = t.levels.map((level, d) => `
      <div class="level">${level.map((n, i) => `
        <div class="node${d===0?' leaf':''}${n.on_path?' path':''}${n.sibling?' sib':''}"
          ${d===0?`data-leaf="${i}" title="${esc(t.leaf_names[i]||'')}\n${esc(n.hash)}"`
                 :`title="${esc(n.hash)}"`}></div>`).join('')}</div>`).join('');

    el.querySelectorAll('.node.leaf').forEach(n =>
      n.onclick = () => drawTree(Number(n.dataset.leaf)));

    const note = $('#treeNote');
    if(note){
      note.textContent = t.focus === null || t.focus === undefined
        ? 'Click any leaf to trace its path to the root.'
        : `${t.leaf_names[t.focus]} proves against the root with ${t.proof_length} sibling `
          + `hashes — the rest of the run stays undisclosed.`;
    }
  }catch(e){ /* the tree is illustrative; a failure here must not break the page */ }
}

/* ---------------------------------------------------- consent + chain state */
async function chainState(id){
  try{
    const s = await get('/api/chainstate/' + encodeURIComponent(id));
    const pill = $('#consentPill'), body = $('#consentBody');
    if(!pill) return;

    if(!s.written){
      pill.innerHTML = '<span class="pill">not on chain</span>';
      body.innerHTML = '<span class="dim">This bundle was never attested.</span>'; return;
    }
    if(!s.exists){
      pill.innerHTML = '<span class="pill bad">root absent</span>';
      body.innerHTML = '<span class="bad">The chain has no record of this root.</span>'; return;
    }

    if(s.revoked){
      pill.innerHTML = '<span class="pill bad">revoked</span>';
      $('#stage3v').innerHTML = '<span class="bad">revoked</span>';
      $('#stage3').classList.add('bad');
      $('#band').classList.add('warn');
      $('#bandTitle').textContent = 'Attestation withdrawn';
      $('#bandSub').textContent = 'The evidence may still be intact, but the submitter '
        + 'said it should no longer be relied on.';
    } else if(s.has_consent){
      pill.innerHTML = '<span class="pill ok">consent recorded</span>';
    } else {
      pill.innerHTML = '<span class="pill warn">no consent</span>';
    }

    const c = bundle.consent;
    body.innerHTML = `
      <div class="kv">
        ${c ? `<div>subject</div><div>${esc(c.subject)}</div>
        <div>signer</div><div class="hash">${esc(c.signer_address)}</div>
        <div>signed at</div><div>${esc(c.signed_at)}</div>
        <div>covers image</div><div>${c.image_sha256===bundle.query.image_sha256
          ? '<span class="ok">this exact image</span>'
          : '<span class="bad">A DIFFERENT IMAGE</span>'}</div>`
        : '<div>record</div><div class="dim">none in this bundle</div>'}
        <div>on chain</div><div>${s.has_consent
          ? '<span class="ok">consent hash stored</span>'
          : '<span class="warn">no consent hash</span>'}</div>
        <div>status</div><div>${s.revoked
          ? `<span class="bad">withdrawn at ${s.revoked_at}</span>`
          : '<span class="ok">live</span>'}</div>
      </div>
      ${s.revoked ? `<p class="dim" style="font-size:11.5px;margin:11px 0 0">
        Chain history cannot be erased, so the record stands alongside its withdrawal.
        Consumers should ask <code>isLive()</code>, not <code>exists()</code>.</p>`:''}
      ${!s.has_consent && !s.revoked ? `<p class="dim" style="font-size:11.5px;margin:11px 0 0">
        The scan may still have been authorised &mdash; the chain simply does not say so.
        That is a weaker claim than a recorded consent.</p>`:''}`;
  }catch(e){ /* card keeps its placeholder */ }
}

/* ------------------------------------------------------------ verification */
const STEPS = [
  ['fields', 'Re-hash every field'],
  ['root',   'Rebuild the Merkle root'],
  ['chain',  'Look the root up on chain'],
  ['live',   'Check it has not been revoked'],
];

async function runVerify(){
  const btn = $('#vbtn'); btn.disabled = true;
  $('#verdict').innerHTML = '';
  $('#steps').innerHTML = STEPS.map(([k,t]) =>
    `<div class="step" id="st-${k}"><span class="ic"></span><span>${t}</span>
     <span class="detail" id="sd-${k}"></span></div>`).join('');

  try{
    const v = await get('/api/verify/' + encodeURIComponent(current));
    const s = await get('/api/chainstate/' + encodeURIComponent(current));
    const outcomes = {
      fields: [v.diverged.length === 0,
               v.diverged.length ? v.diverged.join(', ') : `all ${v.leaf_count} match`],
      root:   [v.root_ok, short(v.recomputed, 12)],
      chain:  [v.on_chain, v.on_chain ? 'found' : 'not found'],
      live:   [s.revoked !== true, s.revoked ? 'revoked' : 'live'],
    };

    // Stepped rather than instant: any one of these failing is a different kind of
    // problem, and a single green tick hides which.
    for(const [k] of STEPS){
      const el = $('#st-'+k); el.classList.add('live');
      await sleep(430);
      const [pass, detail] = outcomes[k];
      el.classList.remove('live');
      el.classList.add('done', pass ? 'pass' : 'fail');
      el.querySelector('.ic').textContent = pass ? '✓' : '✕';
      $('#sd-'+k).textContent = detail;
      $('#sd-'+k).className = 'detail ' + (pass ? 'ok' : 'bad');
    }

    const tampered = v.diverged.length || !v.root_ok || !v.on_chain;
    const band = $('#band');
    band.classList.remove('ok','bad','warn');
    band.classList.add(tampered ? 'bad' : s.revoked ? 'warn' : 'ok');
    $('#bandTitle').textContent = tampered ? 'Tampered'
      : s.revoked ? 'Not reliable' : 'Verified';
    $('#bandSub').textContent = tampered
      ? 'The evidence no longer matches what was committed.'
      : s.revoked
        ? 'The evidence is intact, but the submitter withdrew this attestation.'
        : 'Every field hashes to its committed leaf, those leaves rebuild the committed '
          + 'root, and that root is the one recorded on chain.';
    if(tampered){ band.classList.add('shake');
      setTimeout(() => band.classList.remove('shake'), 600); }
    band.scrollIntoView({behavior:'smooth', block:'nearest'});
  }catch(e){
    $('#verdict').innerHTML = `<span class="bad">${esc(e.message)}</span>`;
  }finally{ btn.disabled = false; }
}

/* --------------------------------------------------------------- simulator */
function resetSim(){
  $('#simUrl').value = bundle.candidates[0]?.page_url || '';
  $('#simSim').value = bundle.candidates[0]?.similarity ?? '';
  simulate();
}

let simTimer = null;
function simulate(){
  clearTimeout(simTimer);
  simTimer = setTimeout(async () => {
    const edited = JSON.parse(JSON.stringify(bundle));
    if(edited.candidates[0]){
      edited.candidates[0].page_url = $('#simUrl').value;
      const n = parseFloat($('#simSim').value);
      edited.candidates[0].similarity = Number.isNaN(n) ? null : n;
    }
    try{
      const r = await post('/api/simulate', edited);
      const out = $('#simOut');
      if(r.root_ok){
        out.innerHTML = '<span class="dim">unchanged &mdash; matches the commitment</span>';
      }else{
        out.innerHTML = `<div><span class="pill bad">root diverged</span>
            <span class="dim" style="margin-left:9px">${esc(r.diverged.join(', '))}</span></div>
          <div class="hash bad" style="margin-top:8px">${esc(r.recomputed)}</div>
          <div class="dim" style="font-size:11.5px;margin-top:7px">
            ${r.on_chain ? 'still on chain'
              : 'not on chain &mdash; verification would reject this bundle, which is the '
                + 'correct outcome for edited evidence'}</div>`;
      }
    }catch(e){ $('#simOut').innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
  }, 260);
}

loadRuns();
</script></body></html>
