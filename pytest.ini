[pytest]
testpaths = tests
# langsmith_plugin is a globally-installed plugin on some machines and imports a dependency it
# does not declare. Blocking it here keeps this project's tests independent of whatever
# else happens to be in site-packages. Harmless when it is absent.
addopts = -p no:langsmith_plugin --strict-markers -q
markers =
    needs_models: requires scripts/fetch_models.py to have been run
    needs_chain: requires a node on 127.0.0.1:8545
    needs_net: reaches the open internet
